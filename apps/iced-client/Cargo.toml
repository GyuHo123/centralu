[package]
name = "centralu-iced"
version = "0.0.0"
edition = "2021"
publish = false
description = "A native Iced client for the Centralu host, built to measure against the WebView UI"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
